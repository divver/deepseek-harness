[package]
name = "coop-board"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Read-only coop v2 kanban board (Ratatui) for the herdr coop plugin"

[[bin]]
name = "coop-board"
path = "src/main.rs"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
strip = true
